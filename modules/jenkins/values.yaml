controller:

  image:
    repository: "jenkins/jenkins"
    tag: "2.492.3-lts-jdk17"
  imagePullPolicy: "Always"

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  serviceType: LoadBalancer
  servicePort: 8080

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - pipeline-aws:latest
    - credentials-binding:latest
    - credentials:latest
    - pipeline-stage-view:latest
    - github:latest

  JCasC:
    defaultConfig: true
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-credentials"
                      username: "${GITHUB_USER}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub token for pipeline"

  containerEnv:
    - name: GITHUB_USER
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: username
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-secret
          key: token

agent:
  enabled: true
  podTemplates:
    kaniko: |
      - name: kaniko
        label: kaniko
        serviceAccount: kaniko
        containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:debug
            command: /busybox/cat
            ttyEnabled: true
          - name: git
            image: alpine/git:latest
            command: cat
            ttyEnabled: true

persistence:
  enabled: true
  size: 10Gi
  storageClass: gp2

serviceAccount:
  create: true
  name: jenkins