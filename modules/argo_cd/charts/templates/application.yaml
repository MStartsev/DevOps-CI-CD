apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade delete on app removal
spec:
  project: default

  source:
    repoURL: {{ .Values.repoUrl }}
    targetRevision: {{ .Values.targetBranch }}
    path: {{ .Values.chartPath }}
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # Disable in-cluster PostgreSQL StatefulSet - use AWS RDS
        - name: postgres.enabled
          value: "false"
        # RDS endpoint passed as Django POSTGRES_HOST
        - name: config.POSTGRES_HOST
          value: {{ .Values.rdsEndpoint | quote }}
        - name: config.POSTGRES_DB
          value: {{ .Values.rdsDatabaseName | quote }}
        - name: config.POSTGRES_USER
          value: {{ .Values.rdsUsername | quote }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.appNamespace }}

  syncPolicy:
    automated:
      prune: true # delete resources removed from Git
      selfHeal: true # revert manual changes in cluster
    syncOptions:
      - CreateNamespace=true
